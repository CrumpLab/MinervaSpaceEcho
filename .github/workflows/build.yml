name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<version from CMakeLists.txt>) from this build"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (engine tests, tools, VST3 + pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Generate test audio and render smoke test
        run: |
          build/tools/mse-testgen test-audio
          build/tools/mse-render --preset presets/passthrough.txt test-audio/full_mix_120bpm.wav rendered.wav
          cmp test-audio/full_mix_120bpm.wav rendered.wav  # pass-through must be bit-exact

      - name: Render example presets
        run: scripts/render_examples.sh build renders

      - name: Editor snapshots
        run: |
          mkdir -p ui
          xvfb-run -a build/plugin/mse-ui-snapshot ui/editor.png 1040 760 "07 Three Heads" 9
          xvfb-run -a build/plugin/mse-ui-snapshot ui/editor-small.png 860 620 "04 Deja Vu" 3
          xvfb-run -a build/plugin/mse-ui-snapshot ui/editor-grains.png 1280 900 "20 Grain Cloud"

      - name: pluginval (VST3)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            "build/plugin/MinervaSpaceEcho_artefacts/Release/VST3/MINERVA Space Echo.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: example-renders
          path: renders
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: editor-snapshots
          path: ui
          retention-days: 14

  macos:
    name: macOS (universal AU + VST3 + pluginval)
    runs-on: macos-14
    env:
      # Optional (repository secrets): Developer ID signing and notarization.
      # Without them the build is ad-hoc signed. See docs/RELEASING.md.
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
      MACOS_SIGN_APP: ${{ secrets.MACOS_SIGN_APP }}
      MACOS_SIGN_INSTALLER: ${{ secrets.MACOS_SIGN_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check universal binaries and ad-hoc sign
        run: |
          ART="build/plugin/MinervaSpaceEcho_artefacts/Release"
          lipo -info "$ART/VST3/MINERVA Space Echo.vst3/Contents/MacOS/MINERVA Space Echo"
          lipo -info "$ART/AU/MINERVA Space Echo.component/Contents/MacOS/MINERVA Space Echo"
          codesign --force --deep --sign - "$ART/VST3/MINERVA Space Echo.vst3"
          codesign --force --deep --sign - "$ART/AU/MINERVA Space Echo.component"

      - name: Install plugins for validation
        run: |
          ART="build/plugin/MinervaSpaceEcho_artefacts/Release"
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R "$ART/AU/MINERVA Space Echo.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "$ART/VST3/MINERVA Space Echo.vst3" ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i crumplab || true

      - name: auval
        run: auval -strict -v aufx MnSE Crmp

      - name: pluginval (VST3 + AU)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process "$HOME/Library/Audio/Plug-Ins/VST3/MINERVA Space Echo.vst3"
          $PV --strictness-level 10 --validate-in-process "$HOME/Library/Audio/Plug-Ins/Components/MINERVA Space Echo.component"

      - name: Import signing certificates
        if: env.MACOS_CERTS_P12 != ''
        run: |
          KC_PW="$(uuidgen)"
          echo "$MACOS_CERTS_P12" | base64 --decode > certs.p12
          security create-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm certs.p12

      - name: Package (zip + installer)
        run: scripts/package_macos.sh build/plugin/MinervaSpaceEcho_artefacts/Release dist

      - uses: actions/upload-artifact@v4
        with:
          name: MinervaSpaceEcho-macOS
          path: dist/*
          retention-days: 30

  release:
    name: GitHub release (tags v*, or Run workflow with "release")
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MinervaSpaceEcho-macOS
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Run workflow: the version in CMakeLists.txt; the release creates the tag
            # on the commit that was just built.
            TAG="v$(sed -nE 's/^project\(.* VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          fi
          VERSION="${TAG#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '$0 ~ "^## \\[?" v {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          # Fixed file names, so .../releases/latest/download/MinervaSpaceEcho-macOS.pkg
          # (linked from the README) always gets the newest release.
          mkdir -p upload
          cp dist/*-macOS.pkg upload/MinervaSpaceEcho-macOS.pkg
          cp dist/*-macOS.zip upload/MinervaSpaceEcho-macOS.zip
          gh release create "$TAG" upload/* --target "$GITHUB_SHA" --title "MINERVA Space Echo $VERSION" \
            --notes-file notes.md --latest
